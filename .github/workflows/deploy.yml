name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # O contexto `secrets` NÃO pode ser usado num `if:` de step (o GitHub
    # recusa o workflow inteiro, com "workflow file issue" e nenhum log útil).
    # Mapeado aqui pra env, que pode.
    env:
      POLIA_APP_TOKEN: ${{ secrets.POLIA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # A casca de e-mail daqui é cópia da do produto, e o teste sabe comparar
      # as duas -- mas só se o outro repo estiver por perto. Sem o secret
      # POLIA_APP_TOKEN (um token de leitura do silvianunoli/polia-app), este
      # passo é pulado e o teste de divergência se pula junto: o resto da
      # suíte continua rodando normal.
      - name: Clonar o polia-app pra comparar a casca de e-mail
        if: env.POLIA_APP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: silvianunoli/polia-app
          token: ${{ env.POLIA_APP_TOKEN }}
          path: _polia-app
          sparse-checkout: supabase/functions/_shared
          sparse-checkout-cone-mode: false

      # Antes do build de propósito: é aqui que a casca de e-mail é conferida
      # (cor fora da paleta, serifada em título, divergência com o produto).
      # Falhou, o deploy não sai -- que é melhor do que o e-mail errado chegar
      # na caixa de entrada.
      - run: npm test
        env:
          CASCA_DO_APP: ${{ env.POLIA_APP_TOKEN != '' && '_polia-app/supabase/functions/_shared/email-polia.ts' || '' }}

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Fábrica Social — chave pública (anon), por isso "vars" e não
          # "secrets", igual às duas de cima. O segredo de verdade
          # (FABRICA_SOCIAL_SUPABASE_SERVICE_ROLE_KEY) não passa por aqui:
          # é secret do Worker (`wrangler secret put`), lido em runtime, não
          # em build time. Ver §Fábrica Social no CLAUDE.md.
          VITE_FABRICA_SOCIAL_SUPABASE_URL: ${{ vars.VITE_FABRICA_SOCIAL_SUPABASE_URL }}
          VITE_FABRICA_SOCIAL_SUPABASE_ANON_KEY: ${{ vars.VITE_FABRICA_SOCIAL_SUPABASE_ANON_KEY }}
          VITE_FABRICA_SOCIAL_APP_URL: ${{ vars.VITE_FABRICA_SOCIAL_APP_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
